<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, Times, serif;
        }
        h1 {
            font-size: 2.5em;
            text-align: center;
            text-decoration: underline;
        }
        table {
            border-collapse: collapse;
            margin: auto;
            width: 700px;
            height: 400px;
            text-align: center;
            box-shadow: 10px 10px 20px black;
        }
        caption {
            font-size: 2em;
            padding: 10px;
            text-shadow: 10px 10px 20px black;
            text-align: left;
        }
        th, td {
            border: 2px solid black;
        }
        .cabeca {
            background-color: rgba(0, 0, 0, 0.606);
            color: white;
            font-size: 1.5em;
        }
        .cabeca1 {
            background-color: darkgray;
            font-size: 1.1em;
        }
        #alinha {
            text-align: left;
            padding-left: 10px;
        }

    </style>
</head>
<body>
    <h1>Desafio 02</h1>
    <table>
        <thead>
            <caption>Notas do Aluno</caption>
            <tr class="cabeca">
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col" class="cabeca1">Notas 1</th>
                <th scope="col" class="cabeca1">Notas 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td id="alinha">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="alinha">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="alinha">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <td id="alinha">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="cabeca" id="alinha">Média de Exatas</th>
                <td class="cabeca">0.0</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td id="alinha">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="alinha">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="cabeca" id="alinha">Média de Humanas</th>
                <td class="cabeca">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
