<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Desafio 02</title>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }
        table {
            width: 600px;
            height: 500px;
            margin: auto;
        }
        td {
            border: 1px solid black;
            text-align: center;
            font-size: 2em;
        }
        h1 {
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Desafio 02</h1>
    <table>
        <tr>
            <td colspan="4" style="background-color: blueviolet;">A</td>
            <td rowspan="4" style="background-color: chartreuse;">B</td>
            
        </tr>
        <tr>
            <td rowspan="4" style="background-color: aqua;">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
            
        </tr>
        <tr>
            <td colspan="4" style="background-color: bisque;">N</td>
            
        </tr>
</body>
</html>
