<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Desafio 01</title>
    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
            font-weight: bolder;
        }
        table {
            width: 800px;
            height: 600px;
            text-align: center;
            margin: auto;
            font-size: 2em;
        }
        td {
            border: 1px solid black;
        }
        h1 {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <h1>Desafio 01</h1>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2" style="background-color: lightcoral;">3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td colspan="3" style="background-color: lightgreen;">8</td>
            <td>9</td>
        </tr>
        <tr>
            <td rowspan="2" style="background-color: lightskyblue;">10</td>
            <td colspan="2" style="background-color: lightslategrey;">11</td>
            <td>12</td>
            
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            
        </tr>
    </table>
</body>
</html>
