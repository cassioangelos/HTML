<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclando tabela</title>
    <style>
        body {
            font-family: cursive;
        }
        table {
            border-collapse: collapse;
            width: 600px;
        }
        td {
           border: 3px solid black; 
           padding: 10px;
           text-align: center;
            
        }
    </style>
</head>
<body>
    <h1>Mesclando as células</h1>
    <table>
        <tr>
            
            <td colspan="2" style="background-color: blueviolet;">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td rowspan="2" style="background-color: blanchedalmond;">F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            
        </tr>
        <tr style="background-color: aqua;">
            <td colspan="3">J</td>
            
            
        </tr>
    </table>
</body>
</html>
