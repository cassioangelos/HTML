<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        th,td {
            padding: 10px;
            border: 1px solid black;
        }
        table {
            width: 500px;
            margin: auto;
            border-collapse: collapse;
        }
        thead, tfoot {
            background-color: cadetblue;
        }
        .num {
            text-align: right;
        }
        h1 {
            text-align: center;
        }
        

    </style>
</head>
<body>
    <h1>Tabelas grandes</h1>
    <table>
        <thead>
            <tr>
                <th>Estados</th>
                <th>População</th>
            </tr>
        </thead>
            
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">24.000</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">24.000</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">24.000</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">24.000</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">24.000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td class="num"><strong>201.000.000</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
